<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ศูนย์ติดตาม KPI - รวมแดชบอร์ด</title>
<style>
  :root{
    --ink-900:#0D1424;
    --canvas:#EEF1F7;
    --surface:#FFFFFF;
    --line:#E1E5EF;
    --text-900:#101526;
    --text-600:#525C74;
    --teal:#0EA5A0;
    --teal-dark:#0B8580;
    --teal-100:#DFF5F3;
    --radius-md:12px;
    --shadow-card:0 1px 2px rgba(13,20,36,.04), 0 8px 24px rgba(13,20,36,.06);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --canvas:#0A0F1D;
      --surface:#151E33;
      --line:#2A3555;
      --text-900:#EDF0F8;
      --text-600:#AEB7CC;
      --teal-100:rgba(14,165,160,.16);
      --shadow-card:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--canvas);}
  body{
    font-family:'IBM Plex Sans Thai','Segoe UI',sans-serif;
    color:var(--text-900);
    display:flex;
    flex-direction:column;
  }
  header{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-top,0px));
    padding-top:calc(10px + env(safe-area-inset-top,0px));
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:var(--shadow-card);
  }
  .tabs{
    display:flex;
    gap:6px;
    background:var(--canvas);
    padding:4px;
    border-radius:var(--radius-md);
  }
  .tab-btn{
    border:none;
    background:transparent;
    color:var(--text-600);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    padding:8px 16px;
    border-radius:9px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .tab-btn.active{
    background:var(--teal);
    color:#fff;
  }
  .tab-btn:not(.active):hover{
    background:var(--teal-100);
    color:var(--teal-dark);
  }
  main{
    flex:1;
    position:relative;
    min-height:0;
  }
  .pane{
    position:absolute;
    inset:0;
    display:none;
  }
  .pane.active{ display:block; }
  .pane iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }
  .loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-600);
    font-size:14px;
    gap:8px;
  }
</style>
</head>
<body>

<header>
  <div class="tabs" role="tablist">
    <button class="tab-btn active" data-target="pane-personal" id="btn-personal" role="tab" aria-selected="true">ส่วนบุคคล</button>
    <button class="tab-btn" data-target="pane-team" id="btn-team" role="tab" aria-selected="false">ส่วนงาน</button>
  </div>
</header>

<main>
  <div class="pane active" id="pane-personal">
    <iframe id="iframe-personal" title="แดชบอร์ดส่วนบุคคล"></iframe>
  </div>
  <div class="pane" id="pane-team">
    <div class="loading" id="loading-team">กำลังโหลด...</div>
    <iframe id="iframe-team" title="แดชบอร์ดส่วนงาน" style="display:none;"></iframe>
  </div>
</main>

  function b64ToDataUrl(b64){
    return "data:text/html;base64," + b64;
  }

  // Load personal dashboard immediately (default active tab)
  document.getElementById('iframe-personal').src = b64ToDataUrl(DASH_PERSONAL_B64);

  var teamLoaded = false;
  function loadTeamIfNeeded(){
    if(teamLoaded) return;
    teamLoaded = true;
    var f = document.getElementById('iframe-team');
    f.src = b64ToDataUrl(DASH_TEAM_B64);
    f.onload = function(){
      document.getElementById('loading-team').style.display = 'none';
      f.style.display = 'block';
    };
  }

  var buttons = document.querySelectorAll('.tab-btn');
  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      buttons.forEach(function(b){
        b.classList.remove('active');
        b.setAttribute('aria-selected','false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected','true');

      document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('active'); });
      var target = document.getElementById(btn.dataset.target);
      target.classList.add('active');

      if(btn.dataset.target === 'pane-team'){
        loadTeamIfNeeded();
      }
    });
  });
</script>
