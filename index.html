<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ศูนย์รวมแดชบอร์ด - กรมควบคุมมลพิษ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0D1424;
    --canvas:#EEF1F7;
    --surface:#FFFFFF;
    --line:#E1E5EF;
    --text-900:#101526;
    --text-600:#525C74;
    --teal:#0EA5A0;
    --teal-dark:#0B8580;
    --teal-100:#DFF5F3;
    --shadow-card:0 1px 2px rgba(13,20,36,.04), 0 8px 24px rgba(13,20,36,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'IBM Plex Sans Thai',sans-serif;
    background:var(--canvas);
    color:var(--text-900);
    display:flex;
    flex-direction:column;
  }
  h1{font-family:'Kanit','IBM Plex Sans Thai',sans-serif;}

  /* Top bar */
  .topbar{
    display:flex;
    align-items:center;
    gap:18px;
    padding:12px 24px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    box-shadow:var(--shadow-card);
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:1.02rem;
    color:var(--ink-900);
    white-space:nowrap;
  }
  .brand-dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--teal),#6D6AF6);
    flex-shrink:0;
  }

  /* Tab nav */
  .tabnav{
    display:flex;
    gap:6px;
    background:var(--canvas);
    padding:4px;
    border-radius:12px;
    flex:1;
    min-width:280px;
  }
  .tab-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px 16px;
    border:none;
    border-radius:9px;
    background:transparent;
    color:var(--text-600);
    font-family:'IBM Plex Sans Thai',sans-serif;
    font-weight:600;
    font-size:.92rem;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .tab-btn svg{width:17px;height:17px;flex-shrink:0;}
  .tab-btn:hover{color:var(--ink-900);}
  .tab-btn.active{
    background:var(--surface);
    color:var(--teal-dark);
    box-shadow:var(--shadow-card);
  }
  .tab-btn .badge{
    font-size:.68rem;
    font-weight:600;
    padding:2px 7px;
    border-radius:999px;
    background:var(--teal-100);
    color:var(--teal-dark);
  }
  .tab-btn.active .badge{background:var(--teal);color:#fff;}

  .openext{
    display:flex;align-items:center;gap:6px;
    padding:9px 14px;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--surface);
    color:var(--text-600);
    font-size:.82rem;
    font-weight:500;
    text-decoration:none;
    white-space:nowrap;
    transition:border-color .15s ease,color .15s ease;
  }
  .openext:hover{border-color:var(--teal);color:var(--teal-dark);}
  .openext svg{width:14px;height:14px;}

  /* Frame area */
  .frame-wrap{
    flex:1;
    position:relative;
    min-height:0;
  }
  .frame-page{
    position:absolute;
    inset:0;
    display:none;
  }
  .frame-page.active{display:block;}
  .frame-page iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }
  .loading-hint{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color:var(--text-600);
    font-size:.9rem;
    background:var(--canvas);
    pointer-events:none;
  }
  .spinner{
    width:26px;height:26px;
    border:3px solid var(--line);
    border-top-color:var(--teal);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Split view */
  .split-container{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:row;
  }
  .split-pane{
    position:relative;
    flex:1 1 0;
    min-width:120px;
    display:flex;
    flex-direction:column;
    background:var(--canvas);
  }
  .split-pane-label{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    font-size:.78rem;
    font-weight:600;
    color:var(--text-600);
    flex-shrink:0;
  }
  .split-pane-label svg{width:14px;height:14px;flex-shrink:0;}
  .split-pane-body{
    position:relative;
    flex:1;
    min-height:0;
  }
  .split-pane-body iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }
  .split-divider{
    flex:0 0 6px;
    width:6px;
    background:var(--line);
    cursor:col-resize;
    position:relative;
    flex-shrink:0;
    transition:background .15s ease;
  }
  .split-divider:hover, .split-divider.dragging{background:var(--teal);}
  .split-drag-overlay{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    cursor:col-resize;
    background:transparent;
  }
  .split-drag-overlay.active{display:block;}
  .split-drag-overlay.row-cursor{cursor:row-resize;}
  .split-divider::after{
    content:"";
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:3px;height:36px;
    border-radius:3px;
    background:var(--text-600);
    opacity:.35;
  }

  @media (max-width:720px){
    .topbar{padding:10px 14px;gap:10px;}
    .brand span.brand-text{display:none;}
    .tab-btn{font-size:.82rem;padding:9px 8px;}
    .openext .label{display:none;}
    .split-container{flex-direction:column;}
    .split-divider{width:100%;height:6px;flex:0 0 6px;cursor:row-resize;}
    .split-divider::after{width:36px;height:3px;}
  }
</style>
</head>

<script>
(function(){
  var tabs = document.querySelectorAll('.tab-btn');
  var pages = { personal: document.getElementById('page-personal'), department: document.getElementById('page-department'), split: document.getElementById('page-split') };
  var extLink = document.getElementById('openExtLink');
  // srcMap no longer needed; open-in-new-tab now uses blob URLs

  // hide loading hint once an iframe fires 'load'
  function wireLoad(key){
    var frame = document.getElementById('iframe-' + key);
    var hint = document.getElementById('loading-' + key);
    frame.addEventListener('load', function(){
      if (hint) hint.style.display = 'none';
    });
  }
  ['personal', 'department', 'split-personal', 'split-department'].forEach(wireLoad);

  function b64ToUtf8(b64){
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  var htmlContent = {
    personal: b64ToUtf8(document.getElementById('html-personal-b64').textContent),
    department: b64ToUtf8(document.getElementById('html-department-b64').textContent)
  };
  var blobUrls = {};

  function loadFrame(id){
    var frame = document.getElementById(id);
    var key = frame && frame.getAttribute('data-key');
    if (frame && key && !frame.dataset.loaded) {
      frame.srcdoc = htmlContent[key];
      frame.dataset.loaded = '1';
    }
  }

  function getBlobUrl(key){
    if (!blobUrls[key]) {
      var blob = new Blob([htmlContent[key]], {type: 'text/html'});
      blobUrls[key] = URL.createObjectURL(blob);
    }
    return blobUrls[key];
  }

  // load the initially active tab's content right away
  loadFrame('iframe-personal');
  extLink.setAttribute('href', getBlobUrl('personal'));

  tabs.forEach(function(btn){
    btn.addEventListener('click', function(){
      var target = btn.getAttribute('data-target');

      tabs.forEach(function(b){
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
      });
      Object.keys(pages).forEach(function(key){
        pages[key].classList.toggle('active', key === target);
      });

      if (target === 'split') {
        loadFrame('iframe-split-personal');
        loadFrame('iframe-split-department');
        extLink.style.display = 'none';
      } else {
        loadFrame('iframe-' + target);
        extLink.style.display = '';
        extLink.setAttribute('href', getBlobUrl(target));
      }
    });
  });

  // Draggable divider between the two split panes
  (function(){
    var container = document.getElementById('splitContainer');
    var divider = document.getElementById('splitDivider');
    var overlay = document.getElementById('splitDragOverlay');
    var left = document.getElementById('splitPaneLeft');
    var right = document.getElementById('splitPaneRight');
    var dragging = false;

    function isVertical(){
      return getComputedStyle(container).flexDirection === 'column';
    }

    function setSplit(ratio){
      ratio = Math.min(0.8, Math.max(0.2, ratio));
      left.style.flex = ratio + ' 1 0';
      right.style.flex = (1 - ratio) + ' 1 0';
    }

    function onMove(clientX, clientY){
      var rect = container.getBoundingClientRect();
      var ratio;
      if (isVertical()) {
        ratio = (clientY - rect.top) / rect.height;
      } else {
        ratio = (clientX - rect.left) / rect.width;
      }
      setSplit(ratio);
    }

    function startDrag(){
      dragging = true;
      divider.classList.add('dragging');
      overlay.classList.add('active');
      overlay.classList.toggle('row-cursor', isVertical());
      document.body.style.userSelect = 'none';
    }

    function endDrag(){
      if (!dragging) return;
      dragging = false;
      divider.classList.remove('dragging');
      overlay.classList.remove('active');
      document.body.style.userSelect = '';
    }

    divider.addEventListener('mousedown', function(e){
      startDrag();
      e.preventDefault();
    });
    overlay.addEventListener('mousemove', function(e){
      if (!dragging) return;
      onMove(e.clientX, e.clientY);
    });
    overlay.addEventListener('mouseleave', endDrag);
    window.addEventListener('mouseup', endDrag);

    divider.addEventListener('touchstart', function(e){
      startDrag();
      e.preventDefault();
    }, {passive:false});
    overlay.addEventListener('touchmove', function(e){
      if (!dragging) return;
      var t = e.touches[0];
      onMove(t.clientX, t.clientY);
      e.preventDefault();
    }, {passive:false});
    overlay.addEventListener('touchend', endDrag);
    window.addEventListener('touchend', endDrag);

    window.addEventListener('resize', function(){
      if (dragging) overlay.classList.toggle('row-cursor', isVertical());
    });
  })();
})();
</script>
</body>
